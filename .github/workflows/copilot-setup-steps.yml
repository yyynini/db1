name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Azure CLI authentication
        shell: pwsh
        run: |
          az account show
          Write-Host "Azure CLI authenticated"

      - name: Verify Kusto access
        shell: pwsh
        run: |
          az account get-access-token --resource "https://help.kusto.windows.net" --query accessToken -o tsv | Out-Null
          Write-Host "Kusto access token acquired"
