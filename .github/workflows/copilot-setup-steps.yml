name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Azure CLI authentication
        shell: bash
        run: |
          az account show && echo "Azure CLI authenticated"

      - name: Verify Kusto access
        shell: bash
        run: |
          az account get-access-token --resource "https://help.kusto.windows.net" --query accessToken -o tsv && echo "Kusto access verified"

      - name: Verify ADO access
        shell: bash
        run: |
          az account get-access-token --resource "499b84ac-1321-427f-aa17-267ca6975798" --query accessToken -o tsv && echo "ADO access verified"
