runs-on: self-hosted

steps:
  - name: Verify Azure CLI authentication
    run: |
      az account show
      echo "Azure CLI authenticated"

  - name: Verify Kusto access token
    run: |
      az account get-access-token --resource "https://help.kusto.windows.net" --query accessToken -o tsv > /dev/null
      echo "Kusto access verified"

  - name: Verify ADO access token
    run: |
      az account get-access-token --resource "499b84ac-1321-427f-aa17-267ca6975798" --query accessToken -o tsv > /dev/null
      echo "ADO access verified"
