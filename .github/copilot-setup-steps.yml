name: "Copilot Setup Steps"

on:
  workflow_dispatch:

runs-on: self-hosted

steps:
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Verify Azure CLI authentication
    shell: pwsh
    run: |
      az account show
      Write-Host "✓ Azure CLI is authenticated"

  - name: Verify Kusto (Azure Data Explorer) access
    shell: pwsh
    run: |
      az extension add --name kusto --yes 2>$null
      az kusto cluster list --query "[].{name:name, state:state}" -o table
      Write-Host "✓ Kusto access verified"
