name: "Copilot Setup Steps"

on:
  workflow_dispatch:

runs-on: self-hosted

steps:
  - name: Verify Azure CLI authentication
    run: |
      az account show
      echo "✓ Azure CLI is authenticated"

  - name: Verify Kusto (Azure Data Explorer) access
    run: |
      az extension add --name kusto --yes 2>/dev/null || true
      az kusto cluster list --query "[].{name:name, state:state}" -o table
      echo "✓ Kusto access verified"
