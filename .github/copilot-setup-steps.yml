name: "Copilot Setup Steps"

runs-on: self-hosted

steps:
  - name: Install Node.js for Copilot agent
    shell: pwsh
    run: |
      $nodeDir = "$env:RUNNER_TEMP\ghcca-node\node"
      New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
      $nodeUrl = "https://nodejs.org/dist/v20.18.3/node-v20.18.3-win-x64.zip"
      $zipPath = "$env:RUNNER_TEMP\node.zip"
      Invoke-WebRequest -Uri $nodeUrl -OutFile $zipPath
      Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\ghcca-node" -Force
      Move-Item "$env:RUNNER_TEMP\ghcca-node\node-v20.18.3-win-x64\*" $nodeDir -Force
      Remove-Item "$env:RUNNER_TEMP\ghcca-node\node-v20.18.3-win-x64" -Recurse -Force
      Write-Host "Node.js installed at: $nodeDir\node.exe"
      & "$nodeDir\node.exe" --version

  - name: Verify Azure CLI authentication
    shell: pwsh
    run: |
      az account show
      Write-Host "Azure CLI is authenticated"

  - name: Verify Kusto access
    shell: pwsh
    run: |
      az extension add --name kusto --yes 2>$null
      az kusto cluster list --query "[].{name:name, state:state}" -o table
      Write-Host "Kusto access verified"
